          - Developed fusion models for multimodal data, integrating clinical, radiological, and pathological information, with support for missing modalities to enhance predictive performance.
          - Streamlined data preprocessing and curation pipelines to ensure high-quality, consistent inputs for machine learning workflows.
          - Presented results to cross-functional teams and international stakeholders at annual project meetings.
          - Visiting Researcher at RWTH Aachen University (Aachen, Germany), March 2026, developing digital twin to simulate and model disease trajectories in NSCLC patients.
